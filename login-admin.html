<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login curador — SangueBR</title>
<link rel="stylesheet" href="sanguesp-styles.css">
</head>
<body>

<header class="topo">
  <h1><svg width="26" height="26" viewBox="0 0 24 24" style="vertical-align:-5px; margin-right:6px;"><path d="M12 2C12 2 4 12 4 16.5C4 20.09 7.13 23 11 23H13C16.87 23 20 20.09 20 16.5C20 12 12 2 12 2Z" fill="#b3122b"/></svg>Sangue<span>BR</span></h1>
  <p>Área do curador</p>
</header>

<div class="container">
  <div id="msgBox"></div>
  <form id="formLogin">
    <div class="field">
      <label for="email">E-mail</label>
      <input type="email" id="email" required>
    </div>
    <div class="field">
      <label for="senha">Senha</label>
      <input type="password" id="senha" required>
    </div>
    <button type="submit" class="btn btn-primary btn-block" id="btnLogin">Entrar</button>
  </form>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script>
  function mostraMsg(texto, tipo) {
    document.getElementById('msgBox').innerHTML = `<div class="msg ${tipo}">${texto}</div>`;
  }

  document.getElementById('formLogin').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = document.getElementById('btnLogin');
    btn.disabled = true;
    btn.textContent = 'Entrando...';

    const { error } = await sb.auth.signInWithPassword({
      email: document.getElementById('email').value.trim(),
      password: document.getElementById('senha').value,
    });

    if (error) {
      mostraMsg('E-mail ou senha inválidos.', 'error');
      btn.disabled = false;
      btn.textContent = 'Entrar';
      return;
    }

    window.location.href = 'admin.html';
  });
</script>
</body>
</html>
